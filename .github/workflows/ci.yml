name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      server_url:
        description: HTTPS Hatcheck address for the Windows MSI
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    # The postgres service container runs on both matrix legs. GitHub Actions
    # has no clean way to make the `services` block itself conditional on a
    # matrix value; an idle postgres container on the sqlite leg is harmless.
    services:
      postgres:
        image: postgres:17
        env:
          # CI-only throwaway credentials for an ephemeral service container
          # that exists only for the duration of the job. Not a real secret.
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test (sqlite)
        if: matrix.db == 'sqlite'
        run: bun run test
        env:
          HATCHECK_TEST_DB: sqlite
      - name: Test (postgres)
        if: matrix.db == 'postgres'
        run: bun run test
        env:
          # PG integration tests self-skip unless this is set. Same CI-only
          # throwaway service credentials as above.
          HATCHECK_TEST_DB: postgres
          HATCHECK_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Build web bundle
        run: bun run build
      # E2E runs on one leg only; it exercises sqlite standalone mode.
      # serve.ts rebuilds the bundle itself, so ordering after the build
      # step is belt-and-braces, not a dependency.
      - name: Install Playwright browsers
        if: matrix.db == 'sqlite'
        run: bunx playwright install --with-deps chromium
      - name: E2E (playwright)
        if: matrix.db == 'sqlite'
        run: bun run e2e

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Fail for advisories at every severity; keep unsigned test artifacts
      # behind both the test and dependency audit jobs.
      - name: Dependency vulnerability audit
        run: bun audit
        continue-on-error: false

  # Unsigned standalone TEST builds (maintainer decision, pulled forward
  # from Phase 3 for hands-on Phase 1 testing). Downloadable from the run's
  # artifacts; the signed, attested release pipeline remains Phase 3.
  compile:
    runs-on: ubuntu-latest
    needs: [test, audit]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Compile standalone binaries
        run: bun run compile
      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: hatcheck-windows-x64
          path: dist/bin/hatcheck-windows-x64.exe
      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: hatcheck-linux-x64
          path: dist/bin/hatcheck-linux-x64

  # User-authorized MSI pilot delivery. Workstations only open the HTTPS app.
  windows-msi:
    runs-on: windows-latest
    needs: [test, audit]
    permissions:
      contents: read
    env:
      # Push/PR builds use a synthetic address unless this variable is set.
      HATCHECK_SERVER_URL: ${{ inputs.server_url || vars.HATCHECK_SERVER_URL || 'https://hatcheck.example.test' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
      - name: Build unsigned MSI and launcher
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/package-windows.ps1 -ServerUrl $env:HATCHECK_SERVER_URL -Version $version -OutputDirectory dist/windows
      - name: Build upgrade fixture
        shell: pwsh
        run: |
          $version = [Version](Get-Content package.json -Raw | ConvertFrom-Json).version
          $nextVersion = '{0}.{1}.{2}' -f $version.Major, $version.Minor, ($version.Build + 1)
          ./scripts/package-windows.ps1 -ServerUrl https://replacement.example.test -Version $nextVersion -OutputDirectory dist/windows-upgrade -SkipTests
      - name: Verify installation, repair, upgrade and uninstall
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist/windows/*.msi | Select-Object -First 1).FullName
          $upgradeMsi = (Get-ChildItem dist/windows-upgrade/*.msi | Select-Object -First 1).FullName
          ./packaging/windows/Test-Installer.ps1 -MsiPath $msi -UpgradeMsiPath $upgradeMsi -ServerUrl $env:HATCHECK_SERVER_URL
      - name: Upload unsigned MSI pilot package
        uses: actions/upload-artifact@v4
        with:
          name: hatcheck-windows-msi-unsigned
          path: |
            dist/windows/*.msi
            dist/windows/launcher-*/Hatcheck.exe
            dist/windows/launcher-*/*.txt
            dist/windows/SHA256SUMS
            dist/windows/README.txt
          if-no-files-found: error

  aws-config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
      - name: Validate configuration without provisioning
        working-directory: infra/aws
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate
          terraform test
      - name: Verify deployment helper gates without AWS writes
        run: python3 -m unittest discover -s scripts/aws -p 'test_*.py'
